# Private GTA SA Tabletop prototype. Settings are loaded when the game starts.
# Set enabled=0 to restore the upstream immersive VR camera without rebuilding.
enabled=1
passthrough=1

# Start at the farthest/smallest tabletop zoom. Two-hand grab can still enlarge
# it continuously up to the existing maximum.
visual_scale=0.010

# Physical placement relative to the recentered headset origin.
anchor_forward_m=1.25
anchor_down_m=0.55

# 0/1/2/3 select 30/60/75/120 metres. R3 cycles this at runtime.
radius_preset=1
